<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shields Skin Dose Calculator</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           font-family: "Segoe UI", sans-serif; background: #ffffff; color: #333333; }
    h1 { font-weight: 500; font-size: 24px; margin: 0 0 24px; }
    p { margin: 16px 0 0; color: #666666; }
    .spinner { width: 40px; height: 40px; border: 4px solid #dddddd; border-top-color: #337ab7; border-radius: 50%;
               animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Shields Skin Dose Calculator</h1>
  <div class="spinner"></div>
  <p>Starting up. This can take up to a minute the first time.</p>
</body>
</html>
